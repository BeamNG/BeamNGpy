default:
  image: python:3.11
  tags:
    - docker

stages:
  - test
  - build
  - deploy

.test-job-base:
  stage: test
  environment: TESTING
  variables:
    TESTING_BRANCH: "branches/0.40.x"  # "trunk" or "branches/<branch-name>"
    TESTING_REVISION: "191694"
    TESTING_TARGET: ".temp/testing"
    TESTS_PATH: "tests"
    HEADLESS: "1"
    GFX: "vk"
  before_script:
    - git clone -b feature/beamngpy $TESTING_REPO $TESTING_TARGET
    - python -u $TESTING_TARGET/beamngpy/setup_environment.py
  after_script:
    - python -u tests/scripts/copy_log.py
    - python -u $TESTING_TARGET/beamngpy/cleanup_environment.py
  artifacts:
    when: always
    paths:
      - junit.xml
      - revision.txt
      - beamng.log
    expire_in: 6 months
    reports:
      junit: junit.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      variables:
        TESTING_BRANCH: "trunk"
        TESTING_REVISION: "latest"
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev"'
    - when: never

test-job-windows:
  extends: .test-job-base
  tags:
    - testing_servers
    - windows
  parallel:
    matrix:
      - GFX: ["d3d12", "dx11", "vk"]
  script:
    - .\tests\scripts\run_tests.ps1

test-job-linux:
  extends: .test-job-base
  tags:
    - testinglinux
  before_script:
    - git clone -b feature/beamngpy $TESTING_REPO $TESTING_TARGET
    - python3 -u $TESTING_TARGET/beamngpy/setup_environment.py
  after_script:
    - python3 -u tests/scripts/copy_log.py
    - python3 -u $TESTING_TARGET/beamngpy/cleanup_environment.py
  script:
    - bash tests/scripts/run_tests.sh

build-pages:
  needs: []  # do not wait for earlier stages
  stage: build
  variables:
    GIT_STRATEGY: clone  # use fresh clone of repository (avoiding any old branches)
    USE_DEV_BRANCH: "true"
  script:
    - bash docs/build.sh
  pages: true  # specifies that this is a Pages job
  publish: docs/build  # should be nested under "pages" property starting from GitLab 17.9
  artifacts:
    paths:
      - docs/build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev"'
    - when: never

deploy-production:
  needs: []  # do not wait for earlier stages
  stage: deploy
  variables:
    GIT_STRATEGY: clone  # use fresh clone of repository (avoiding any old branches)
    USE_DEV_BRANCH: "false"
    DOCUMENTATION_REPOSITORY: "$DOCUMENTATION_REPOSITORY"
    DOCUMENTATION_BRANCH: "master"
    DOCUMENTATION_LOCAL_REPO: "docs/production"
    DOCUMENTATION_SSH_PRIVATE_KEY: "$SSH_PRIVATE_KEY"
    DOCUMENTATION_GIT_USERNAME: "$GITLAB_USER_NAME"
    DOCUMENTATION_GIT_EMAIL: "$GITLAB_USER_EMAIL"
    DOCUMENTATION_ARTIFACTS_PATH: "docs/build"
    DOCUMENTATION_TARGET_PATH: "static/api/beamngpy"
  script:
    - bash docs/build.sh
    - bash docs/deploy_production.sh
  artifacts:
    paths:
      - docs/build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"'
    - when: never
